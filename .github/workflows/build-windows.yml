name: Build Windows game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build:win
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: skyline-windows-${{ github.run_number }}
          name: Skyline City Windows build ${{ github.run_number }}
          files: release/Skyline-City-Windows.exe
          make_latest: true
          generate_release_notes: true