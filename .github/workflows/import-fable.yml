name: Import Skyline City base

on:
  push:
    paths:
      - ".github/workflows/import-fable.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Fable Cities
        run: |
          rm -rf /tmp/fable
          git clone --depth 1 https://github.com/rawprogress/fable-cities.git /tmp/fable

      - name: Replace prototype with Fable Cities base
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" -exec rm -rf {} +
          rsync -a --exclude=".git" --exclude=".github" /tmp/fable/ ./

          # Rebrand the open-source base for this project while retaining its licenses/notices.
          grep -RIl --exclude-dir=.git --exclude-dir=.github -e "Fable Cities" -e "fable-cities" . | while read -r file; do
            sed -i \
              -e 's/Fable Cities/Skyline City/g' \
              -e 's/fable-cities/skyline-city/g' \
              -e 's#https://github.com/rawprogress/fable-cities#https://github.com/marcosrbertoni-hub/blank-page-buddy-54#g' \
              -e 's#https://fablecities.rawscollections.com#https://blank-page-buddy-54.lovable.app#g' \
              "$file" || true
          done

          # New games open from the new-city flow instead of a prebuilt demo.
          if [ -f src/core/Config.js ]; then
            sed -i "s/this.demo = p.has('demo') ? p.get('demo') !== '0' : !this.showcase;/this.demo = p.has('demo') ? p.get('demo') !== '0' : false;/" src/core/Config.js
            sed -i "s/: 'high';/: 'medium';/" src/core/Config.js
          fi

          # Keep this importer workflow available for future controlled rebuilds.
          mkdir -p .github/workflows

      - name: Install and build
        run: |
          node --version
          npm --version
          npm ci
          npm run build

      - name: Commit imported game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace prototype with Skyline City base" || exit 0
          git push origin HEAD:main
