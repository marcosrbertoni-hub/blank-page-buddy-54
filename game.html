<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyline City</title><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0f14}body{font-family:Inter,Segoe UI,system-ui,sans-serif;color:#e8edf2}#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}#ui-root{position:fixed;inset:0;pointer-events:none;z-index:10}#ui-root>*{pointer-events:auto}#loading{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1200px 800px at 50% 40%,#16202b 0%,#0b0f14 70%)}#loading h1{font-weight:300;letter-spacing:.35em;font-size:28px;margin:0 0 18px;text-transform:uppercase}#loading .bar{width:320px;height:3px;background:rgba(255,255,255,.08);overflow:hidden}#loading .bar>i{display:block;height:100%;width:0%;background:#4fc3f7}.status{margin-top:12px;font-size:12px;letter-spacing:.12em;color:#8da0b3;text-transform:uppercase}</style></head><body><canvas id="game" tabindex="0"></canvas><div id="ui-root"></div><div id="loading"><h1>Skyline City</h1><div class="bar"><i id="loading-bar"></i></div><div class="status" id="loading-status">Initialising</div></div><script type="module" src="/src/main.js"></script></body></html>
